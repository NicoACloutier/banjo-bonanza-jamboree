# Runs the backend tests on every push and pull request that touches the
# backend, and deploys it to Fly.io from main once a FLY_API_TOKEN repository
# secret exists (see DEPLOYMENT.md). The frontend is built and deployed by
# Cloudflare Pages itself.
name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FLY_API_TOKEN != ''

      - name: Deploy to Fly.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
