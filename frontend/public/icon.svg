<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#4e342e"/>
  <!-- Neck and headstock, running up and to the right from the pot. -->
  <g transform="rotate(40 256 256)">
    <rect x="232" y="18" width="48" height="250" rx="10" fill="#8d6e63"/>
    <rect x="220" y="6" width="72" height="62" rx="16" fill="#6d4c41"/>
    <g fill="#c9a227">
      <circle cx="210" cy="24" r="10"/>
      <circle cx="210" cy="52" r="10"/>
      <circle cx="302" cy="24" r="10"/>
      <circle cx="302" cy="52" r="10"/>
    </g>
    <g stroke="#3e2723" stroke-width="3">
      <line x1="232" y1="100" x2="280" y2="100"/>
      <line x1="232" y1="140" x2="280" y2="140"/>
      <line x1="232" y1="180" x2="280" y2="180"/>
      <line x1="232" y1="220" x2="280" y2="220"/>
    </g>
  </g>
  <!-- The pot: gold rim around a parchment head. -->
  <circle cx="200" cy="312" r="150" fill="#c9a227"/>
  <circle cx="200" cy="312" r="128" fill="#f3e5c0"/>
  <!-- Bridge and tailpiece. -->
  <rect x="160" y="330" width="80" height="14" rx="4" fill="#6d4c41"/>
  <!-- Strings from the tailpiece up the neck. -->
  <g stroke="#9e9e9e" stroke-width="3">
    <line x1="176" y1="420" x2="385" y2="70"/>
    <line x1="190" y1="424" x2="395" y2="78"/>
    <line x1="204" y1="428" x2="405" y2="86"/>
    <line x1="218" y1="432" x2="415" y2="94"/>
  </g>
</svg>
